    <body>
        <header>
            <nav>
            <a href="index.html" aria-label="Ir al inicio">
                <img src="recursos/img/logo.png" alt="Logo de la empresa" height="100">
            </a>
                <a href="index.html" class="ancla">Acerca de mi</a>
                <a href="contacto.html" class="ancla">Contacto</a>
            </nav>
        </header>

        <main>
            <p>Solicita tu cotización. Completa el siguiente formulario con los detalles de tu proyecto, volumen de palabras o tipo de documento, y te enviaré un presupuesto detallado en menos de 24 horas hábiles.</p>
            <form action="contacto.html" method="post" class="formulario">
  
                <label for="id-nombre">Nombre</label>
                <input type="text" name="nombre" id="id-nombre">
                    
                <label for="id-telefono">Teléfono</label>
                <input type="tel" name="telefono" id="id-telefono">
                <label for="id-servicio">Servicio de interes</label>
                <select name="servicio" id="id-servicio">
                    <option value="TP">Traducción publica y legal</option>
                    <option value="TT">Traducción técnica</option>
                    <option value="R">Revision y Corrección</option>
                </select>

                <label for="id-comentario">Detalles del trabajo y area</label>
                <textarea name="comentario" id="id-comentario"></textarea>
                <button type="submit">Enviar</button>
            </form>
        </main>
