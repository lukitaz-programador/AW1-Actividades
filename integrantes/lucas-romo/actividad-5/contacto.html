<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huellitas</title>
</head>

<body>
    <header>
        <nav>
            <a href="index.html" aria-label="Ir al inicio">
                <img src="recursos/imagenes/huella.png" alt="Logo veterinaria" size="420">
            </a>
            <a href="index.html">Inicio</a>
            <a href="catalogo.html">Catálogo</a>
            <a href="contacto.html">Contacto</a>
        </nav>
    </header>

    <main>
        <h1>Contacto</h1>
        <h2>Escribinos!!!</h2>
        <form action="contacto.html" method="post">
            <!--
            Nombre
            Telefono
            Tamaño
            edad
            aclaraciones
            -->
            <label for="id-nombre">Nombre</label>
            <input type="text" name="nombre" id="id-nombre">

            <label for="id-telefono">Teléfono</label>
            <input type="tel" name="telefono" id="id-telefono">
            <label for="id-tamaño">Tamaño</label>
            <select name="tamaño-animal" id="id-tamaño">
                <option value="c">Chico</option>
                <option value="m">Mediano</option>
                <option value="g">Grande</option>
            </select>
            <label for="id-edad">Edad</label>
            <input type="number" name="edad" id="id-edad">
            <label for="id-comentario">Comentarios sobre la mascota</label>
            <textarea name="comentario" id="id-comentario"></textarea>
            <button type="submit">Enviar</button>
        </form>
        <h2>Dónde estamos?</h2>
        <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3404.8001094005594!2d-64.19168096853947!3d-31.419632974019923!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x9432a286a09424ab%3A0x637dd38a25e5eb11!2sBlvd.%20San%20Juan%20200%2C%20X5022%20C%C3%B3rdoba!5e0!3m2!1ses!2sar!4v1788354720981!5m2!1ses!2sar"
            width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
            referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </main>

    <footer>
        <ul>
            <li>
                <a href="https://instagram/@Huellitas" target="_blank">
                    Huellitas
                </a>
            </li>
            <li>
                Bv. San Juan 200 - Bº Nueva Córdoba
            </li>
        </ul>
    </footer>
</body>

</html>
